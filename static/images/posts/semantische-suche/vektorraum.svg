<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <defs>
    <marker id="arrow-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b74b0" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="480" rx="16" fill="#f5f6fb" stroke="#e1e4f2" stroke-width="1.5" />

  <!-- Chunk stack -->
  <g>
    <rect x="50" y="82" width="170" height="66" rx="8" fill="#ffffff" stroke="#c7cce8" stroke-width="1.5" />
    <rect x="50" y="177" width="170" height="66" rx="8" fill="#ffffff" stroke="#c7cce8" stroke-width="1.5" />
    <rect x="50" y="272" width="170" height="66" rx="8" fill="#ffffff" stroke="#c7cce8" stroke-width="1.5" />

    <text x="135" y="109" text-anchor="middle" font-size="13" font-weight="600" fill="#262b52">Chunk 1</text>
    <rect x="66" y="118" width="138" height="6" rx="3" fill="#e1e4f2" />
    <rect x="66" y="130" width="98" height="6" rx="3" fill="#e1e4f2" />

    <text x="135" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#262b52">Chunk 2</text>
    <rect x="66" y="213" width="138" height="6" rx="3" fill="#e1e4f2" />
    <rect x="66" y="225" width="112" height="6" rx="3" fill="#e1e4f2" />

    <text x="135" y="299" text-anchor="middle" font-size="13" font-weight="600" fill="#262b52">Chunk 3</text>
    <rect x="66" y="308" width="138" height="6" rx="3" fill="#e1e4f2" />
    <rect x="66" y="320" width="80" height="6" rx="3" fill="#e1e4f2" />
  </g>
  <text x="135" y="368" text-anchor="middle" font-size="13" fill="#6b74b0">Dokument in Chunks</text>

  <!-- Arrows into embedding box -->
  <path d="M225,115 L262,175" stroke="#6b74b0" stroke-width="1.5" fill="none" marker-end="url(#arrow-v)" />
  <path d="M225,210 L262,210" stroke="#6b74b0" stroke-width="1.5" fill="none" marker-end="url(#arrow-v)" />
  <path d="M225,305 L262,245" stroke="#6b74b0" stroke-width="1.5" fill="none" marker-end="url(#arrow-v)" />

  <!-- Embedding model box -->
  <rect x="270" y="150" width="180" height="180" rx="12" fill="#eef0fb" stroke="#8891d6" stroke-width="1.5" />
  <circle cx="320" cy="205" r="6" fill="#8891d6" />
  <circle cx="360" cy="195" r="6" fill="#8891d6" />
  <circle cx="400" cy="215" r="6" fill="#8891d6" />
  <circle cx="335" cy="240" r="6" fill="#8891d6" />
  <circle cx="380" cy="245" r="6" fill="#8891d6" />
  <line x1="320" y1="205" x2="360" y2="195" stroke="#8891d6" stroke-width="1.2" />
  <line x1="360" y1="195" x2="400" y2="215" stroke="#8891d6" stroke-width="1.2" />
  <line x1="320" y1="205" x2="335" y2="240" stroke="#8891d6" stroke-width="1.2" />
  <line x1="335" y1="240" x2="380" y2="245" stroke="#8891d6" stroke-width="1.2" />
  <line x1="400" y1="215" x2="380" y2="245" stroke="#8891d6" stroke-width="1.2" />
  <text x="360" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#262b52">Embedding-</text>
  <text x="360" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#262b52">Modell</text>

  <!-- Arrow to vector space -->
  <path d="M455,225 L545,210" stroke="#6b74b0" stroke-width="1.5" fill="none" marker-end="url(#arrow-v)" />

  <!-- Vector space canvas -->
  <rect x="555" y="60" width="395" height="360" rx="12" fill="#ffffff" stroke="#c7cce8" stroke-width="1.5" />

  <!-- similarity radius around query -->
  <circle cx="695" cy="175" r="78" fill="none" stroke="#4c5fd1" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.6" />

  <!-- cluster A (near query) -->
  <circle cx="655" cy="150" r="8" fill="#4c5fd1" />
  <circle cx="710" cy="135" r="8" fill="#4c5fd1" />
  <circle cx="735" cy="185" r="8" fill="#4c5fd1" />
  <circle cx="660" cy="205" r="8" fill="#4c5fd1" />
  <circle cx="700" cy="220" r="8" fill="#4c5fd1" />

  <!-- cluster B (far) -->
  <circle cx="860" cy="300" r="8" fill="#93a1e0" />
  <circle cx="895" cy="330" r="8" fill="#93a1e0" />
  <circle cx="845" cy="345" r="8" fill="#93a1e0" />
  <circle cx="885" cy="270" r="8" fill="#93a1e0" />

  <!-- query point -->
  <path d="M695,158 L703,172 L719,175 L703,179 L695,193 L687,179 L671,175 L687,172 Z" fill="#e2664d" stroke="#ffffff" stroke-width="1.5" />

  <text x="752" y="405" text-anchor="middle" font-size="13" fill="#6b74b0">Vektorraum</text>
  <text x="695" y="98" text-anchor="middle" font-size="12" fill="#4c5fd1">ähnlichste Treffer</text>
  <text x="880" y="255" text-anchor="middle" font-size="12" fill="#93a1e0">andere Bedeutung</text>
</svg>
